# Cortex application.conf fragment for this lab stack.
# Full generated file includes Play framework boilerplate; this shows the
# parts specific to wiring Cortex into the rest of the stack.

search {
  index = cortex
  uri = "http://elasticsearch:9200"
}

## Secret key used to sign session cookies / API tokens.
## Overridden at container start by the `secret` env var — kept here as a
## placeholder so the file is valid on its own.
play.http.secret.key = "${?CORTEX_SECRET}"

## Analyzers/responders this project activates for the enrichment playbook.
## (Enabled per-org from the Cortex UI after first boot — see docs/setup-guide.md —
## this list just documents which ones the automation layer expects by name.)
# - VirusTotal_GetReport_3_1
# - AbuseIPDB_1_0
# - URLhaus_1_0
# - EmailRep_1_0
# - Shodan_InfoDomain_1_0
# - MISP_2_1 (dual-purpose: also used directly via pymisp in ioc_correlation.py)

cortex {
  jobDirectory = "/tmp/cortex-jobs"
}
