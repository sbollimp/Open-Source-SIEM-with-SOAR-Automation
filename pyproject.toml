[project]
name = "soar-automation"
version = "1.0.0"
description = "Open-source SIEM/SOAR automation layer wiring together Wazuh, TheHive, Cortex, and MISP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.black]
line-length = 110
target-version = ["py310", "py311"]

[tool.flake8]
max-line-length = 110
exclude = [".venv", "docker"]
